<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Siswa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 40px 0;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        .card h3 {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 30px;
        }

        .content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 25px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            font-size: 22px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: bold;
        }

        .btn-add {
            background: #22c55e;
            color: white;
        }

        .btn-add:hover {
            background: #16a34a;
        }

        .search {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
            font-size: 14px;
        }

        td {
            color: #e2e8f0;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
        }

        .modal-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save {
            flex: 1;
            background: #22c55e;
            color: white;
        }

        .btn-cancel {
            flex: 1;
            background: #475569;
            color: white;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 10px 5px;
            }

            .action-buttons {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .btn-edit {
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Data Siswa</h1>
            <p>Website sederhana untuk mengelola data siswa.</p>
        </header>


        <!-- DASHBOARD -->

        <div class="dashboard">

            <div class="card">
                <h3>Jumlah Siswa</h3>
                <strong id="jumlahSiswa">0</strong>
            </div>

            <div class="card">
                <h3>Jumlah Kelas</h3>
                <strong id="jumlahKelas">0</strong>
            </div>

            <div class="card">
                <h3>Status</h3>
                <strong>Aktif</strong>
            </div>

        </div>


        <!-- DATA SISWA -->

        <div class="content">

            <div class="top-bar">

                <h2>Daftar Siswa</h2>

                <button
                    class="btn-add"
                    onclick="bukaModal()"
                >
                    + Tambah Siswa
                </button>

            </div>


            <input
                type="text"
                id="search"
                class="search"
                placeholder="Cari nama atau kelas..."
                oninput="tampilkanSiswa()"
            >


            <table>

                <thead>

                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Aksi</th>
                    </tr>

                </thead>

                <tbody id="tabelSiswa"></tbody>

            </table>

        </div>

    </div>


    <!-- MODAL -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-box">

            <h2 id="judulModal">
                Tambah Siswa
            </h2>


            <div class="form-group">

                <label>
                    Nama Siswa
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama siswa"
                >

            </div>


            <div class="form-group">

                <label>
                    Kelas
                </label>

                <select id="kelas">

                    <option value="">
                        Pilih kelas
                    </option>

                    <option value="XI TKJ 1">
                        XI TKJ 1
                    </option>

                    <option value="XI TKJ 2">
                        XI TKJ 2
                    </option>

                    <option value="XI TKJ 3">
                        XI TKJ 3
                    </option>

                    <option value="XII TKJ 1">
                        XII TKJ 1
                    </option>

                    <option value="XII TKJ 2">
                        XII TKJ 2
                    </option>

                </select>

            </div>


            <div class="modal-buttons">

                <button
                    class="btn-save"
                    onclick="simpanSiswa()"
                >
                    Simpan
                </button>

                <button
                    class="btn-cancel"
                    onclick="tutupModal()"
                >
                    Batal
                </button>

            </div>

        </div>

    </div>


    <script>

        let siswa = JSON.parse(
            localStorage.getItem("dataSiswa")
        ) || [];

        let editIndex = -1;


        // ==============================
        // TAMPILKAN DATA
        // ==============================

        function tampilkanSiswa() {

            const tabel =
                document.getElementById("tabelSiswa");

            const keyword =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();

            const hasil = siswa.filter(function(data) {

                return (
                    data.nama
                        .toLowerCase()
                        .includes(keyword)
                    ||
                    data.kelas
                        .toLowerCase()
                        .includes(keyword)
                );

            });


            tabel.innerHTML = "";


            if (hasil.length === 0) {

                tabel.innerHTML = `
                    <tr>
                        <td
                            colspan="4"
                            class="empty"
                        >
                            Belum ada data siswa.
                        </td>
                    </tr>
                `;

            }


            hasil.forEach(function(data) {

                const index =
                    siswa.indexOf(data);

                tabel.innerHTML += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${data.nama}
                        </td>

                        <td>
                            ${data.kelas}
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="btn-edit"
                                    onclick="editSiswa(${index})"
                                >
                                    Edit
                                </button>

                                <button
                                    class="btn-delete"
                                    onclick="hapusSiswa(${index})"
                                >
                                    Hapus
                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            });


            updateDashboard();

        }


        // ==============================
        // DASHBOARD
        // ==============================

        function updateDashboard() {

            document.getElementById(
                "jumlahSiswa"
            ).textContent = siswa.length;


            const daftarKelas =
                [...new Set(
                    siswa.map(data => data.kelas)
                )];


            document.getElementById(
                "jumlahKelas"
            ).textContent = daftarKelas.length;

        }


        // ==============================
        // BUKA MODAL
        // ==============================

        function bukaModal() {

            editIndex = -1;

            document.getElementById(
                "judulModal"
            ).textContent = "Tambah Siswa";


            document.getElementById(
                "nama"
            ).value = "";


            document.getElementById(
                "kelas"
            ).value = "";


            document.getElementById(
                "modal"
            ).style.display = "flex";

        }


        // ==============================
        // TUTUP MODAL
        // ==============================

        function tutupModal() {

            document.getElementById(
                "modal"
            ).style.display = "none";

        }


        // ==============================
        // SIMPAN DATA
        // ==============================

        function simpanSiswa() {

            const nama =
                document
                    .getElementById("nama")
                    .value
                    .trim();

            const kelas =
                document
                    .getElementById("kelas")
                    .value;


            if (nama === "" || kelas === "") {

                alert(
                    "Nama dan kelas wajib diisi!"
                );

                return;

            }


            const dataBaru = {
                nama: nama,
                kelas: kelas
            };


            if (editIndex === -1) {

                siswa.push(dataBaru);

            } else {

                siswa[editIndex] = dataBaru;

            }


            localStorage.setItem(
                "dataSiswa",
                JSON.stringify(siswa)
            );


            tutupModal();

            tampilkanSiswa();

        }


        // ==============================
        // EDIT
        // ==============================

        function editSiswa(index) {

            editIndex = index;


            document.getElementById(
                "judulModal"
            ).textContent = "Edit Siswa";


            document.getElementById(
                "nama"
            ).value = siswa[index].nama;


            document.getElementById(
                "kelas"
            ).value = siswa[index].kelas;


            document.getElementById(
                "modal"
            ).style.display = "flex";

        }


        // ==============================
        // HAPUS
        // ==============================

        function hapusSiswa(index) {

            const yakin = confirm(
                "Apakah kamu yakin ingin menghapus data ini?"
            );


            if (!yakin) {
                return;
            }


            siswa.splice(index, 1);


            localStorage.setItem(
                "dataSiswa",
                JSON.stringify(siswa)
            );


            tampilkanSiswa();

        }


        // ==============================
        // JALANKAN SAAT PERTAMA DIBUKA
        // ==============================

        tampilkanSiswa();

    </script>

</body>
</html>
